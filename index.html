<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWESOME Website</title>
    <style>
        @keyframes pulse {
            0% {
                scale: 100%;
            }

            50% {
                scale: 150%
            }

            100%{
                scale: 100%;
            }
        }

        .pulse {
            animation: pulse 1s infinite ease-in-out;
        }
    </style>
</head>

<body style="height:100vh; display: flex; justify-content: center; align-items: center;">
    <img class="pulse"
        src="https://i.pinimg.com/originals/f7/7c/fc/f77cfc736e0d32df1b686898c4d4e04c.gif" />
</body>

</html>
